<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tasks</title>
  <meta name="description" content="A simple offline to-do list with reminders and an AI assistant.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <span class="eyebrow" id="today-label"></span>
      <div class="top-actions">
        <button class="focus-pill" id="focus-pill" type="button" hidden aria-label="Focus timer running">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 1h6v2H9V1Zm10.03 6.39 1.42-1.42-1.41-1.41-1.42 1.42A9 9 0 1 0 19.03 7.39ZM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14Zm-1-12h2v5h-2V8Z"/></svg>
          <span id="focus-pill-text">25:00</span>
        </button>
        <button class="icon-btn" id="focus-btn" type="button" aria-label="Focus timer">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 1h6v2H9V1Zm10.03 6.39 1.42-1.42-1.41-1.41-1.42 1.42A9 9 0 1 0 19.03 7.39ZM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14Zm-1-12h2v5h-2V8Z"/></svg>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </div>
    <div class="title-row">
      <h1 id="view-title">Today</h1>
      <span class="progress" id="view-progress"></span>
    </div>
    <nav class="segmented" role="tablist" aria-label="Lists">
      <button type="button" role="tab" data-view="today">Today</button>
      <button type="button" role="tab" data-view="tomorrow">Tomorrow</button>
      <button type="button" role="tab" data-view="later">Later</button>
      <button type="button" role="tab" data-view="done">Done</button>
    </nav>
  </header>

  <div class="banner" id="notif-banner" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
    <span>Turn on notifications so reminders can reach you.</span>
    <button type="button" class="link" id="banner-enable">Turn On</button>
  </div>

  <main id="list" aria-live="polite"></main>

  <!-- Always-visible quick add bar -->
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="composer-ai" id="open-assistant" aria-label="Open AI assistant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2l1.9 5.1L18 9l-5.1 1.9L11 16l-1.9-5.1L4 9l5.1-1.9L11 2Zm7 11 1 2.6 2.6 1-2.6 1L18 22l-1-2.4-2.6-1 2.6-1L18 13Z"/></svg>
    </button>
    <input id="quick-add" placeholder="Add a task" maxlength="200" enterkeyhint="done" aria-label="New task">
    <button type="submit" class="composer-add" id="add-btn" aria-label="Add task">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    </button>
  </form>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link" id="toast-action" hidden>Undo</button>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Task editor -->
  <form class="sheet" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden autocomplete="off">
    <div class="sheet-head">
      <button type="button" class="link" data-close>Cancel</button>
      <h2 id="editor-title">New Task</h2>
      <button type="submit" class="link strong" id="save-btn" disabled>Add</button>
    </div>
    <div class="sheet-body">
      <div class="group">
        <input class="field title-field" id="f-title" name="title" placeholder="What do you need to do?" maxlength="200" required enterkeyhint="done">
        <textarea class="field" id="f-notes" name="notes" placeholder="Notes" rows="2" maxlength="2000"></textarea>
      </div>

      <div class="group-head">
        <h3 class="group-title">Steps</h3>
        <button type="button" class="link small" id="ai-steps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2l1.9 5.1L18 9l-5.1 1.9L11 16l-1.9-5.1L4 9l5.1-1.9L11 2Zm7 11 1 2.6 2.6 1-2.6 1L18 22l-1-2.4-2.6-1 2.6-1L18 13Z"/></svg>
          Suggest steps with AI
        </button>
      </div>
      <div class="group">
        <div id="steps-list"></div>
        <div class="row step-add">
          <span class="step-plus" aria-hidden="true">+</span>
          <input id="step-input" placeholder="Add a step" maxlength="200" enterkeyhint="done" aria-label="Add a step">
        </div>
      </div>

      <div class="chips" role="group" aria-label="Quick date">
        <button type="button" class="chip" data-quick="today">Today</button>
        <button type="button" class="chip" data-quick="tomorrow">Tomorrow</button>
        <button type="button" class="chip" data-quick="week">Next week</button>
        <button type="button" class="chip" data-quick="none">Someday</button>
      </div>

      <div class="group">
        <label class="row">
          <span class="row-icon" style="--c: var(--red)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm-2 8h14v10H5V10Z"/></svg></span>
          <span class="row-label">Date</span>
          <input type="date" id="f-date" name="date">
        </label>
        <label class="row">
          <span class="row-icon" style="--c: var(--purple)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg></span>
          <span class="row-label">Remind me</span>
          <input type="checkbox" class="switch" role="switch" id="f-remind" name="remind">
        </label>
        <label class="row" id="time-row">
          <span class="row-icon" style="--c: var(--accent)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 10.4 3.3 3.3-1.4 1.4L11 13.2V6h2v6.4Z"/></svg></span>
          <span class="row-label">Time</span>
          <input type="time" id="f-time" name="time">
        </label>
        <label class="row">
          <span class="row-icon" style="--c: var(--gray)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1l4 4-4 4V6H7a2 2 0 0 0-2 2v3H3V8a4 4 0 0 1 4-4h10V1ZM7 23l-4-4 4-4v3h10a2 2 0 0 0 2-2v-3h2v3a4 4 0 0 1-4 4H7v3Z"/></svg></span>
          <span class="row-label">Repeat</span>
          <select id="f-repeat" name="repeat">
            <option value="none">Never</option>
            <option value="daily">Every day</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Every week</option>
          </select>
        </label>
        <label class="row">
          <span class="row-icon" style="--c: var(--orange)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h2v1h11.5l-2.5 5 2.5 5H7v9H5V2Z"/></svg></span>
          <span class="row-label">Important</span>
          <input type="checkbox" class="switch" role="switch" id="f-flag" name="flagged">
        </label>
      </div>
      <p class="hint" id="remind-hint" hidden></p>

      <div class="group" id="editor-extra" hidden>
        <button type="button" class="row action" id="ask-ai">
          <span class="row-icon" style="--c: var(--indigo)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2l1.9 5.1L18 9l-5.1 1.9L11 16l-1.9-5.1L4 9l5.1-1.9L11 2Zm7 11 1 2.6 2.6 1-2.6 1L18 22l-1-2.4-2.6-1 2.6-1L18 13Z"/></svg></span>
          <span class="row-label">Ask AI how to get this done</span>
        </button>
        <button type="button" class="row action danger" id="delete-btn">
          <span class="row-label">Delete Task</span>
        </button>
      </div>
    </div>
  </form>

  <!-- AI assistant -->
  <section class="sheet tall" id="assistant" role="dialog" aria-modal="true" aria-labelledby="assistant-title" hidden>
    <div class="sheet-head">
      <button type="button" class="link" id="chat-new">New chat</button>
      <div class="sheet-title">
        <h2 id="assistant-title">Assistant</h2>
        <span class="sheet-sub" id="assistant-model"></span>
      </div>
      <button type="button" class="link strong" data-close>Done</button>
    </div>
    <div class="chat" id="chat-log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form" autocomplete="off">
      <textarea id="chat-text" rows="1" placeholder="Tell me what you need to do…" maxlength="4000" aria-label="Message"></textarea>
      <button type="submit" class="send-btn" id="chat-send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </form>
  </section>

  <!-- Focus timer -->
  <section class="sheet" id="focus" role="dialog" aria-modal="true" aria-labelledby="focus-title" hidden>
    <div class="sheet-head">
      <span></span>
      <h2 id="focus-title">Focus</h2>
      <button type="button" class="link strong" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <div id="focus-setup">
        <h3 class="group-title">How long?</h3>
        <div class="duration-grid" role="group" aria-label="Focus length">
          <button type="button" class="duration" data-min="15"><b>15</b><span>min</span></button>
          <button type="button" class="duration" data-min="25"><b>25</b><span>min</span></button>
          <button type="button" class="duration" data-min="45"><b>45</b><span>min</span></button>
          <button type="button" class="duration" data-min="60"><b>1</b><span>hour</span></button>
          <button type="button" class="duration" data-min="120"><b>2</b><span>hours</span></button>
          <button type="button" class="duration" data-min="custom"><b>…</b><span>Custom</span></button>
        </div>
        <div class="group" id="custom-duration" hidden>
          <label class="row">
            <span class="row-label">Hours</span>
            <input type="number" id="fd-hours" min="0" max="12" step="1" inputmode="numeric" value="0">
          </label>
          <label class="row">
            <span class="row-label">Minutes</span>
            <input type="number" id="fd-mins" min="0" max="59" step="1" inputmode="numeric" value="30">
          </label>
        </div>
        <div class="group">
          <label class="row">
            <span class="row-label">Focus on</span>
            <select id="focus-task"></select>
          </label>
          <label class="row" id="focus-block-row">
            <span class="row-label">Block YouTube Shorts</span>
            <input type="checkbox" class="switch" role="switch" id="focus-block" checked>
          </label>
        </div>
        <p class="hint" id="focus-setup-hint"></p>
        <button type="button" class="primary-btn wide" id="focus-start">Start Focus</button>
      </div>

      <div id="focus-running" hidden>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="54"/>
            <circle class="ring-bar" id="ring-bar" cx="60" cy="60" r="54"/>
          </svg>
          <div class="ring-text">
            <div class="ring-time" id="focus-remaining">25:00</div>
            <div class="ring-sub" id="focus-ends"></div>
          </div>
        </div>
        <p class="focus-task-name" id="focus-task-name"></p>
        <p class="hint center" id="focus-run-hint"></p>
        <div class="focus-actions">
          <button type="button" class="pill-btn" id="focus-add5">+5 min</button>
          <button type="button" class="pill-btn danger" id="focus-stop">End Focus</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="sheet-head">
      <span></span>
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="link strong" data-close>Done</button>
    </div>
    <div class="sheet-body">
      <h3 class="group-title" id="ai-settings-title">AI model</h3>
      <div class="group">
        <label class="row">
          <span class="row-label">Provider</span>
          <select id="ai-provider"></select>
        </label>
        <label class="row stack" id="ai-url-row">
          <span class="row-label">Server URL</span>
          <input class="field-inline" id="ai-url" type="url" inputmode="url" placeholder="http://192.168.1.10:11434/v1" spellcheck="false" autocapitalize="off">
        </label>
        <label class="row stack" id="ai-key-row">
          <span class="row-label">API key</span>
          <input class="field-inline" id="ai-key" type="password" placeholder="Paste your API key" spellcheck="false" autocapitalize="off" autocomplete="off">
        </label>
        <label class="row stack">
          <span class="row-label">Model</span>
          <input class="field-inline" id="ai-model" list="ai-model-list" placeholder="Tap “Load models” or type a name" spellcheck="false" autocapitalize="off">
          <datalist id="ai-model-list"></datalist>
        </label>
        <label class="row" id="ai-model-pick-row" hidden>
          <span class="row-label">Pick a model</span>
          <select id="ai-model-pick"></select>
        </label>
        <button type="button" class="row action" id="ai-load-models">Load models</button>
        <button type="button" class="row action" id="ai-test">Test connection</button>
      </div>
      <p class="hint" id="ai-hint"></p>

      <h3 class="group-title">Focus</h3>
      <div class="group">
        <label class="row">
          <span class="row-icon" style="--c: var(--red)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM5.7 7.1l11.2 11.2A8 8 0 0 1 5.7 7.1Zm12.6 9.8L7.1 5.7a8 8 0 0 1 11.2 11.2Z"/></svg></span>
          <span class="row-label">Block YouTube Shorts</span>
          <input type="checkbox" class="switch" role="switch" id="focus-shorts">
        </label>
        <button type="button" class="row action" id="focus-restricted" hidden>Step 1 · Allow restricted settings</button>
        <button type="button" class="row action" id="focus-accessibility" hidden>Step 2 · Turn on in Accessibility</button>
      </div>
      <p class="hint" id="focus-hint"></p>

      <h3 class="group-title">Reminders</h3>
      <div class="group">
        <div class="row">
          <span class="row-label">Notifications</span>
          <span class="row-value" id="notif-status">—</span>
        </div>
        <button type="button" class="row action" id="notif-enable">Turn On Notifications</button>
        <button type="button" class="row action" id="notif-test">Send Test Notification</button>
        <label class="row">
          <span class="row-label">Default reminder time</span>
          <input type="time" id="s-default-time">
        </label>
      </div>
      <p class="hint" id="notif-hint"></p>

      <h3 class="group-title">Your data</h3>
      <div class="group">
        <button type="button" class="row action" id="export-btn">Export Backup</button>
        <label class="row action" for="import-file">Import Backup</label>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button type="button" class="row action danger" id="clear-done">Clear Completed Tasks</button>
      </div>
      <p class="hint">Tasks are stored only on this device. Backups don't include your API key.</p>

      <div class="group" id="install-group" hidden>
        <button type="button" class="row action" id="install-btn">Install App on Home Screen</button>
      </div>

      <p class="hint center" id="version-label"></p>
    </div>
  </section>

  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
